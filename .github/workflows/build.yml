name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: mrhihi-freevm.ddns.net
      DEPLOY_USER: ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Set up SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          timeout 20s ssh-keyscan -4 -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          timeout 30s ssh -4 -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p /home/ubuntu/Workspace/highspeed/server/dist /home/ubuntu/Workspace/highspeed/client/dist'

      - name: Deploy client
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -C client/dist -czf - . | \
            timeout 45s ssh -4 -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'tmp=$(mktemp -d /tmp/highspeed-client.XXXXXX) && tar -C "$tmp" -xzf - && rm -rf /home/ubuntu/Workspace/highspeed/client/dist && mv "$tmp" /home/ubuntu/Workspace/highspeed/client/dist'

      - name: Deploy server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -C server/dist -czf - . | \
            timeout 45s ssh -4 -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'tmp=$(mktemp -d /tmp/highspeed-server.XXXXXX) && tar -C "$tmp" -xzf - && rm -rf /home/ubuntu/Workspace/highspeed/server/dist && mv "$tmp" /home/ubuntu/Workspace/highspeed/server/dist'

      - name: Restart server and verify health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          timeout 45s ssh -4 -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'pm2 restart highspeed-server --update-env && curl --fail --silent --show-error --max-time 15 http://127.0.0.1:4000/api/health'
